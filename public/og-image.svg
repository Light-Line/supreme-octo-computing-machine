  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <!-- Decorative hexagons -->
  <g opacity="0.1">
    <path d="M100 100L150 120V180L100 200L50 180V120L100 100Z" stroke="#7C3AED" stroke-width="2" fill="none"/>
    <path d="M1100 500L1150 520V580L1100 600L1050 580V520L1100 500Z" stroke="#7C3AED" stroke-width="2" fill="none"/>
    <path d="M600 50L650 70V130L600 150L550 130V70L600 50Z" stroke="#7C3AED" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Logo -->
